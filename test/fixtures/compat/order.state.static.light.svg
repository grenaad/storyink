<svg xmlns="http://www.w3.org/2000/svg" class="storyink" viewBox="0 0 486 1192" width="486" height="1192" role="img" aria-label="State machine" data-storyink="lifecycle"><style>svg.storyink{--si-bg:#e8e7e3;--si-panel:#e6e5e1;--si-panelAlt:#ecebe7;--si-line:#b7b5ad;--si-lineSoft:#cfcdc6;--si-ink:#3d3a34;--si-inkMuted:#6b675f;--si-inkFaint:#a39d91;--si-wire:#a9a79f;--si-port:#a39d91;--si-pill:#e8e7e3;--si-group:#e3e2de;--si-groupLine:#cfcdc6;--si-title:#1c1a17;--si-chrome:#ecebe7;--si-chromeLine:#cfcdc6;--si-rose:#c98f81;--si-roseFill:#d9d3c7;--si-blue:#7fa2bf;--si-blueFill:#d9d3c7;--si-gold:#bfa95a;--si-goldFill:#d9d3c7;--si-sage:#5f7a4f;--si-sageFill:#d9d3c7;--si-plain:#8a857c;--si-plainFill:#d9d3c7;--si-pulse:#2b2925;--si-pulseBloom:#3d3a34;--si-pulseBloomEdge:#8a857c;--si-glow:#f3d9b6;--si-glowCrest:#fffaf0;--si-glowGain:3;--si-glowBlend:screen;--si-flash:#141311;--si-portActive:#141311;--si-playInk:#a39e94;--si-playInkHover:#5e5b54;--si-control:#8f8a81;--si-controlHover:#26251f;--si-endedInk:#6f6a61;color-scheme:light;}
.storyink{font-family:"Commit Mono", ui-monospace, "SF Mono", Menlo, monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0;}
.storyink text{font-family:"Commit Mono", ui-monospace, "SF Mono", Menlo, monospace;fill:var(--si-ink);}
.si-bg{fill:var(--si-bg);}
.si-a-rose{--si-accent:var(--si-rose);--si-accentFill:var(--si-roseFill);}.si-a-blue{--si-accent:var(--si-blue);--si-accentFill:var(--si-blueFill);}.si-a-gold{--si-accent:var(--si-gold);--si-accentFill:var(--si-goldFill);}.si-a-sage{--si-accent:var(--si-sage);--si-accentFill:var(--si-sageFill);}.si-a-plain{--si-accent:var(--si-plain);--si-accentFill:var(--si-plainFill);}
.si-face{fill:var(--si-panel);stroke:var(--si-line);stroke-width:1;}
.si-inset{fill:none;stroke:var(--si-lineSoft);stroke-width:1;}
.si-ink-bar{fill:var(--si-accent);}
