<svg xmlns="http://www.w3.org/2000/svg" class="storyink" viewBox="0 0 1382 356" width="1382" height="356" role="img" aria-label="Product analytics pipeline" data-storyink="dataflow"><style>svg.storyink{--si-bg:#e8e7e3;--si-panel:#e6e5e1;--si-panelAlt:#ecebe7;--si-line:#b7b5ad;--si-lineSoft:#cfcdc6;--si-ink:#3d3a34;--si-inkMuted:#6b675f;--si-inkFaint:#a39d91;--si-wire:#a9a79f;--si-port:#a39d91;--si-pill:#e8e7e3;--si-group:#e3e2de;--si-groupLine:#cfcdc6;--si-title:#1c1a17;--si-chrome:#ecebe7;--si-chromeLine:#cfcdc6;--si-rose:#c98f81;--si-roseFill:#d9d3c7;--si-blue:#7fa2bf;--si-blueFill:#d9d3c7;--si-gold:#bfa95a;--si-goldFill:#d9d3c7;--si-sage:#5f7a4f;--si-sageFill:#d9d3c7;--si-plain:#8a857c;--si-plainFill:#d9d3c7;--si-pulse:#2b2925;--si-pulseBloom:#3d3a34;--si-pulseBloomEdge:#8a857c;--si-glow:#f3d9b6;--si-glowCrest:#fffaf0;--si-glowGain:3;--si-glowBlend:screen;--si-flash:#141311;--si-portActive:#141311;--si-playInk:#a39e94;--si-playInkHover:#5e5b54;--si-control:#8f8a81;--si-controlHover:#26251f;--si-endedInk:#6f6a61;color-scheme:light;}
.storyink{font-family:"Commit Mono", ui-monospace, "SF Mono", Menlo, monospace;font-variant-ligatures:none;font-feature-settings:"calt" 0;}
.storyink text{font-family:"Commit Mono", ui-monospace, "SF Mono", Menlo, monospace;fill:var(--si-ink);}
.si-bg{fill:var(--si-bg);}
.si-a-rose{--si-accent:var(--si-rose);--si-accentFill:var(--si-roseFill);}.si-a-blue{--si-accent:var(--si-blue);--si-accentFill:var(--si-blueFill);}.si-a-gold{--si-accent:var(--si-gold);--si-accentFill:var(--si-goldFill);}.si-a-sage{--si-accent:var(--si-sage);--si-accentFill:var(--si-sageFill);}.si-a-plain{--si-accent:var(--si-plain);--si-accentFill:var(--si-plainFill);}
.si-face{fill:var(--si-panel);stroke:var(--si-line);stroke-width:1;}
.si-inset{fill:none;stroke:var(--si-lineSoft);stroke-width:1;}
.si-ink-bar{fill:var(--si-accent);}
.si-soft{fill:var(--si-accentFill);stroke:var(--si-accent);stroke-width:1;}
.si-dash{stroke-dasharray:4 3;}
.si-glyph{fill:none;stroke:var(--si-accent);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;}
.si-dotfill{fill:var(--si-ink);}
.si-ring{fill:none;stroke:var(--si-ink);stroke-width:1.4;}
.si-note{fill:var(--si-goldFill);stroke:var(--si-gold);stroke-width:1;}
.si-note-fold{fill:none;stroke:var(--si-gold);stroke-width:1;}
.storyink .si-label{font-size:13px;fill:var(--si-ink);}
.storyink .si-detail{font-size:11px;fill:var(--si-inkMuted);}
.storyink .si-tag{font-size:10px;letter-spacing:0.08em;fill:var(--si-accent);}
.storyink .si-pill-label{font-size:12px;}
.si-group{fill:var(--si-group);stroke:var(--si-groupLine);stroke-width:1;}
.si-band{fill:var(--si-panelAlt);fill-opacity:0.75;stroke:none;}
.si-group-composite{fill:var(--si-panelAlt);stroke:var(--si-line);stroke-width:1;}
.storyink .si-group-label{font-size:10px;letter-spacing:0.08em;fill:var(--si-inkFaint);}
.storyink .si-group-title{font-size:12px;fill:var(--si-inkMuted);}
.si-group-rule{stroke:var(--si-groupLine);stroke-width:1;}
.si-wire{fill:none;stroke:var(--si-wire);stroke-width:1;stroke-linecap:round;stroke-linejoin:round;}
.si-wire.si-dashed{stroke-dasharray:3 5;}
.si-wire.si-thick{stroke-width:2;stroke:var(--si-port);}
.si-arrow{fill:var(--si-wire);stroke:var(--si-wire);stroke-width:1;stroke-linejoin:round;}
.si-arrow-open{fill:none;stroke:var(--si-wire);stroke-width:1;stroke-linecap:round;stroke-linejoin:round;}
.si-port{fill:var(--si-port);}
.si-pill{fill:var(--si-bg);stroke:none;}
.si-pill.si-on-group{fill:var(--si-group);}
.si-pill.si-on-composite{fill:var(--si-panelAlt);}
.storyink .si-edge-label{font-size:11px;letter-spacing:0.02em;fill:var(--si-inkMuted);}
.si-life{stroke:var(--si-line);stroke-width:1;stroke-dasharray:3 4;}
.si-act{fill:var(--si-panelAlt);stroke:var(--si-line);stroke-width:1;}
.si-frame{fill:none;stroke:var(--si-line);stroke-width:1;}
.si-frame-tag{fill:var(--si-panelAlt);stroke:var(--si-line);stroke-width:1;}
.storyink .si-frame-kind{font-size:10px;letter-spacing:0.08em;fill:var(--si-inkMuted);font-weight:700;}
.storyink .si-frame-label{font-size:11px;fill:var(--si-inkMuted);}
.si-frame-rule{stroke:var(--si-line);stroke-width:1;stroke-dasharray:4 4;}
.si-seq{fill:var(--si-ink);}
.si-pulse{fill:var(--si-pulse);}
.si-halo{fill:var(--si-pulseBloom);}
.si-ring-pulse{fill:none;stroke:var(--si-pulse);}
.si-trail{fill:none;stroke:var(--si-pulse);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.storyink .si-counter{font-size:15px;font-variant-numeric:tabular-nums lining-nums;fill:var(--si-ink);}
.storyink .si-counter-label{font-size:10px;letter-spacing:0.08em;fill:var(--si-inkMuted);}
